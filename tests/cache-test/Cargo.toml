[package]
name = "cache-test"
version = "0.1.0"
edition = "2024"

[features]
loom = ["dualcache-ff/loom", "dep:loom"]

[dependencies]
dualcache-ff = { path = "../../" }
libfuzzer-sys = "0.4.7"
arbitrary = { version = "1.3", features = ["derive"] }
dhat = "0.3.3"
rand = "0.8.5"
crossbeam-epoch = "0.9"
loom = { version = "0.7", optional = true }