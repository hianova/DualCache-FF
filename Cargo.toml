[package]
name = "dualcache-ff"
version = "1.0.0"
edition = "2024"
authors = ["hianova"]
description = "A wait-free, high-performance concurrent cache optimized for extreme read-to-write ratios."
license = "MIT"
repository = "https://github.com/hianova/DualCache-FF"
documentation = "https://docs.rs/dualcache-ff"
readme = "ReadMe.md"
keywords = ["cache", "concurrent", "wait-free", "lock-free", "performance"]
categories = ["caching", "concurrency", "data-structures"]
exclude = ["*.DS_Store", "/target", ".covopt/", ".agents/"]


[features]
default = ["std"]
std = ["ahash/std"]
daemon = ["std"]

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng"] }
no_std_tool = { path = "../no_std_tool" }

[dev-dependencies]
crossbeam-utils = "0.8.21"
hdrhistogram = "7.5.4"
rand = "0.8"
rand_distr = "0.4"
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "componant_argument"
path = "bench/componant_argument.rs"
harness = false

[[bench]]
name = "extreme_optimization"
harness = false

[profile.bench]
debug = true

[profile.release]
debug = true
