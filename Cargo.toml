[package]
name = "dualcache-ff"
version = "2.0.0"
edition = "2024"
authors = ["hianova"]
description = "A wait-free, high-performance concurrent cache optimized for extreme read-to-write ratios."
license = "MIT"
repository = "https://github.com/hianova/DualCache-FF"
documentation = "https://docs.rs/dualcache-ff"
readme = "ReadMe.md"
keywords = ["cache", "concurrent", "wait-free", "lock-free", "performance"]
categories = ["caching", "concurrency", "data-structures"]
exclude = ["*.DS_Store", "/target", ".covopt/", ".agents/"]


[features]
default = ["std", "daemon"]
std = ["ahash/std", "no_std_tool/std", "dep:arc-swap"]
daemon = ["std"]
covopt = []

[dependencies]
covopt-macro = { workspace = true }
no_std_tool_macros = { workspace = true }
ahash = { workspace = true, features = ["compile-time-rng"] }
no_std_tool = { workspace = true }
arc-swap = { workspace = true, optional = true }

[dev-dependencies]
crossbeam-utils = { workspace = true }
hdrhistogram = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
criterion = { workspace = true }
core_affinity = "0.8.3"

[[bench]]
name = "benchmark"
harness = false


[[bench]]
name = "extreme_optimization"
harness = false

[[bench]]
name = "covopt_harness"
harness = false

[[bench]]
name = "thesis_hit_rate_capacity"
harness = false

[[bench]]
name = "thesis_throughput_contention"
harness = false

[[bench]]
name = "thesis_tail_latency"
harness = false

[[bench]]
name = "thesis_decoupling_iron_triangle"
harness = false

[[bench]]
name = "thesis_fetch_update"
harness = false

[[bench]]
name = "thesis_tls_vs_global"
harness = false

[[bench]]
name = "thesis_probabilistic_promotion"
harness = false

[[bench]]
name = "thesis_write_asymmetry"
harness = false

[[bench]]
name = "thesis_cddb_regression"
harness = false

[[bench]]
name = "thesis_l3_barrier"
harness = false

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

