[package]
name = "dualcache-ff"
version = "1.1.0"
edition = "2024"
authors = ["hianova"]
description = "A wait-free, high-performance concurrent cache optimized for extreme read-to-write ratios."
license = "MIT"
repository = "https://github.com/hianova/DualCache-FF"
documentation = "https://docs.rs/dualcache-ff"
readme = "ReadMe.md"
keywords = ["cache", "concurrent", "wait-free", "lock-free", "performance"]
categories = ["caching", "concurrency", "data-structures"]
exclude = ["*.DS_Store", "/target", ".covopt/", ".agents/"]


[features]
default = ["std", "daemon"]
std = ["ahash/std", "no_std_tool/std"]
daemon = ["std"]
covopt = []

[dependencies]
lazy_static = { workspace = true }
no_std_tool_macros = { workspace = true }
ahash = { version = "0.8", features = ["compile-time-rng"] }
no_std_tool = { path = "../../core/no_std_tool", version = "1.1.0" }

[dev-dependencies]
crossbeam-utils = "0.8.21"
hdrhistogram = "7.5.4"
rand = "0.8"
rand_distr = "0.4"
criterion = "0.5"
core_affinity = "0.8.3"

[[bench]]
name = "benchmark"
harness = false


[[bench]]
name = "extreme_optimization"
harness = false

[[bench]]
name = "covopt_harness"
harness = false

[profile.bench]
debug = true

[profile.release]
debug = true


[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

