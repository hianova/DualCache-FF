[package]
name = "dualcache-ff"
version = "1.0.0"
edition = "2024"
authors = ["hianova"]
description = "A wait-free, high-performance concurrent cache optimized for extreme read-to-write ratios."
license = "MIT"
repository = "https://github.com/hianova/DualCache-FF"
documentation = "https://docs.rs/dualcache-ff"
readme = "ReadMe.md"
keywords = ["cache", "concurrent", "wait-free", "lock-free", "performance"]
categories = ["caching", "concurrency", "data-structures"]
exclude = ["*.DS_Store", "/target"]

[features]
default = ["std"]
std = ["ahash/std", "crossbeam-channel"]
daemon = ["std"]
loom = ["dep:loom"]

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng"] }
lazy_static = "1.5.0"
crossbeam-channel = { version = "0.5", optional = true }
spin = { version = "0.12.1", default-features = false, features = ["mutex", "spin_mutex"] }
loom = { version = "0.7.2", optional = true }

[dev-dependencies]
crossbeam-utils = "0.8.21"
hdrhistogram = "7.5.4"
loom = "0.7.2"
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "benchmark"
harness = false

[profile.bench]
debug = true

[profile.release]
debug = true
